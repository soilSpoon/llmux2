name: Coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          key: workspace-artifacts-v1
      - name: Remove stale coverage data
        run: |
          cargo llvm-cov clean --profraw-only --locked
          rm -f target/llvm-cov-target/*.profdata target/llvm-cov-target/*-profraw-list
          rm -rf target/llvm-cov
      - name: Run Rust unit and integration tests with coverage
        run: cargo llvm-cov nextest --locked --workspace --no-clean --json --summary-only --output-path coverage.json
      - name: Enforce coverage floor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo xtask coverage-ratchet coverage.json
