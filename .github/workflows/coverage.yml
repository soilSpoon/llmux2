name: Coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: policy-tools
          cache-workspace-crates: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Run Rust unit and integration tests with coverage
        run: cargo llvm-cov --locked --workspace --json --summary-only --output-path coverage.json
      - name: Enforce coverage floor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo xtask coverage-ratchet coverage.json
