[workspace]
resolver = "2"
members = [
    "deploy",
    "bench",
    "xtask",
    "crates/llmux-login",
    "crates/llmux-import",
    "crates/llmux-types",
    "crates/llmux-config",
    "crates/llmux-core",
    "crates/llmux-providers",
    "crates/llmux-server",
    "crates/llmux-testkit",
    "crates/llmux-cli",
    "crates/llmux-mcp",
]
default-members = ["crates/llmux-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jsonwebtoken = "9.3"
rand = "0.8"
sha2 = "0.10"
tempfile = "3"
url = { version = "2", features = ["serde"] }
webbrowser = "1"
arc-swap = "1"
llmux-types = { path = "crates/llmux-types" }
llmux-config = { path = "crates/llmux-config" }
llmux-core = { path = "crates/llmux-core" }
llmux-providers = { path = "crates/llmux-providers" }
llmux-testkit = { path = "crates/llmux-testkit" }
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
memchr = "2"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
