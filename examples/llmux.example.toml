[server]
listen = "127.0.0.1:8080"
client_keys = ["env:LLMUX_CLIENT_KEY"]
request_timeout_ms = 120000
shutdown_timeout_ms = 60000 # drain in-flight requests/streams, then exit; 1–86400000 ms
drain_grace_ms = 2000 # 0–10000 ms; cap below WatchdogSec=30 (shared-port probes may hit draining slot)
expose_routing_headers = true
# dashboard_key = "env:LLMUX_DASHBOARD_KEY"
# request_log = "/var/log/llmux/requests.jsonl" # append-only per-request routing records (JSONL)
# Hashed end-user attribution is off until end_user_header is set. The salt must
# be an env: or file: secret, never a literal. The response header is always
# x-llmux-end-user and carries only the hash.
# end_user_header = "x-llmux-end-user"
# end_user_salt = "env:LLMUX_END_USER_SALT"
# end_user_from_body = true
# remote_images = "allow" # or "reject"
# max_image_bytes = 5000000

[routing]
max_attempts = 2
fallback_on = ["rate_limited", "quota_exhausted"]

[cooldown]
default_ms = 30000
max_ms = 3600000

[[credentials]]
id = "groq-key"
kind = "api_key"
provider = "openai_compat"
key = "env:GROQ_API_KEY"

# Alternatively, configure OAuth refresh-token credentials (see README):
# [[credentials]]
# id = "oauth-account"
# kind = "oauth"
# provider = "openai_compat"
# token_url = "https://auth.example.com/oauth/token"
# client_id = "gateway-client"
# refresh_token = "file:/path/to/refresh-token" # rotations atomically rewrite this file (0600 on Unix)
# client_secret = "env:UPSTREAM_CLIENT_SECRET" # optional
# scopes = ["inference"] # optional
# resource = "https://api.openai.com/v1" # optional HTTPS URL; omit scopes for Sign in with ChatGPT
# refresh_skew_ms = 60000
# request_timeout_ms = 30000

[[credentials]]
id = "together-key"
kind = "api_key"
provider = "openai_compat"
key = "env:TOGETHER_API_KEY"

[[credentials]]
id = "packet-key"
kind = "api_key"
provider = "openai_compat"
key = "env:PACKET_API_KEY"

[[credentials]]
id = "nvidia-key"
kind = "api_key"
provider = "openai_compat"
key = "env:NVIDIA_API_KEY"

[[credentials]]
id = "zen-key"
kind = "api_key"
provider = "openai_compat"
key = "env:OPENCODE_ZEN_API_KEY"

[[credentials]]
id = "freemodel-key"
kind = "api_key"
provider = "openai_compat"
key = "env:FREEMODEL_API_KEY"

[[credentials]]
id = "anthropic-key"
kind = "api_key"
provider = "anthropic"
key = "env:ANTHROPIC_API_KEY"

[[models]]
name = "llama-3.3-70b"
aliases = ["llama-70b"]
capabilities = { stream = true, max_context = 131072 }

[[models.deployments]]
id = "groq-llama70b"
credential = "groq-key"
base_url = "https://api.groq.com/openai/v1"
upstream_model = "llama-3.3-70b-versatile"
priority = 0
timeout_ms = 30000

[[models.deployments]]
id = "together-llama70b"
credential = "together-key"
base_url = "https://api.together.xyz/v1"
upstream_model = "meta-llama/Llama-3.3-70B-Instruct-Turbo"
priority = 10
timeout_ms = 30000

# Temporary free offers and free tiers. These are for testing and failover, not
# capacity you can budget: see docs/free-providers.md. Each upstream limit below
# is set lower than the documented limit on purpose.

[[models]]
name = "deepseek-v4.1-flash"
capabilities = { stream = true, max_context = 131072 }

# packet.ai Token Factory: every token is $0 until 2026-12-16, then paid. The
# provider's model table gives 131K context for both models, so max_context below
# matches it; a larger window is unverified without a key to probe.
[[models.deployments]]
id = "packet-deepseek-v4.1-flash"
credential = "packet-key"
base_url = "https://api.packet.ai/v1"
upstream_model = "nvidia/DeepSeek-V4.1-Flash-NVFP4"
priority = 0
timeout_ms = 60000
expires_at = 2026-12-16T23:59:59Z

# OpenCode Zen free pool. Free-tier model access is documented for the OpenCode
# client; an outside caller may be refused with FreeUsageLimitError.
[[models.deployments]]
id = "zen-deepseek-v4.1-flash"
credential = "zen-key"
base_url = "https://opencode.ai/inference/openai/v1"
upstream_model = "deepseek-v4.1-flash-free"
priority = 10
timeout_ms = 60000

[[models]]
name = "minimax-m3.1-flash"
capabilities = { stream = true, max_context = 131072 }

[[models.deployments]]
id = "packet-minimax-m3.1-flash"
credential = "packet-key"
base_url = "https://api.packet.ai/v1"
upstream_model = "MiniMaxAI/MiniMax-M3.1-Flash"
timeout_ms = 60000
expires_at = 2026-12-16T23:59:59Z

[[models]]
name = "gemma-4-31b"
capabilities = { stream = true }

# NVIDIA NIM: no announced end date, so no expires_at. The model page advertises
# a free endpoint but prints no numerical limit; ~40 RPM is third-party reported,
# so 20 leaves headroom.
[[models.deployments]]
id = "nvidia-gemma-4-31b"
credential = "nvidia-key"
base_url = "https://integrate.api.nvidia.com/v1"
upstream_model = "google/gemma-4-31b-it"
timeout_ms = 60000
quota = { rpm = 20 }

[[models]]
name = "hy4-flash"
capabilities = { stream = true, max_context = 1048576 }

[[models.deployments]]
id = "zen-hy4-flash"
credential = "zen-key"
base_url = "https://opencode.ai/inference/openai/v1"
upstream_model = "hy4-flash-free"
timeout_ms = 60000
expires_at = 2026-11-30T23:59:59Z

[[models]]
name = "big-pickle"
capabilities = { stream = true, max_context = 200000 }

# Free "for a limited time" with no stated end date, so no expires_at. The
# provider may train on conversations sent to it; see docs/free-providers.md.
[[models.deployments]]
id = "zen-big-pickle"
credential = "zen-key"
base_url = "https://opencode.ai/inference/openai/v1"
upstream_model = "big-pickle"
timeout_ms = 60000

[[models]]
name = "claude-fable-5"
capabilities = { stream = true, max_context = 1000000 }

# freemodel.in is a third-party aggregator with a recurring free allowance (1M
# tokens a month, prompt and reply counted together), not an expiring promo, so
# no expires_at. QuotaSpec cannot express a monthly token total; the rpm cap
# below only limits burst. The monthly cap is enforced upstream and fails with
# HTTP 402, which llmux2 treats as quota_exhausted.
[[models.deployments]]
id = "freemodel-claude-fable-5"
credential = "freemodel-key"
base_url = "https://freemodel.in/v1"
upstream_model = "claude-fable-5"
timeout_ms = 60000
quota = { rpm = 10 }

[[models]]
name = "claude-sonnet"
capabilities = { stream = true }

[[models.deployments]]
id = "anthropic-sonnet"
credential = "anthropic-key"
base_url = "https://api.anthropic.com/v1"
upstream_model = "claude-sonnet-4-5"
timeout_ms = 60000

# Devin SWE-2 through the `devin acp` CLI bridge. `devin_acp` takes no
# credential: the gateway spawns `devin` (LLMUX_DEVIN_BIN, default `devin` on
# PATH) with HOME pointed at LLMUX_DEVIN_HOME (default $HOME/.devin-sandbox),
# which must hold the CLI's own credentials.toml. swe-2-high is free.
[[models]]
name = "swe-2"
capabilities = { stream = true, max_context = 262144 }

[[models.deployments]]
id = "devin-swe2-high"
auth = "none"
provider = "devin_acp"
upstream_model = "swe-2-high"
priority = 0
timeout_ms = 120000

