[server]
listen = "127.0.0.1:8080"
client_keys = ["env:LLMUX_CLIENT_KEY"]
request_timeout_ms = 120000
# max_request_bytes = 134217728 # bytes; positive, default 128 MiB per inbound request body
# request_body_memory_bytes = 1048576 # bytes in RAM before ingress rolls over to disk
# request_body_spool_dir = "/var/tmp/llmux2-request-bodies" # disk-backed dir; restart-only on reload
# request_body_spool_budget_bytes = 536870912 # total in-flight spool bytes; exhaustion returns 503
shutdown_timeout_ms = 60000 # drain in-flight requests/streams, then exit; 1–86400000 ms
drain_grace_ms = 2000 # 0–10000 ms; cap below WatchdogSec=30 (shared-port probes may hit draining slot)
expose_routing_headers = true
# dashboard_key = "env:LLMUX_DASHBOARD_KEY"
# request_log = "/var/log/llmux/requests.jsonl" # append-only per-request routing records (JSONL)
# Hashed end-user attribution is off until end_user_header is set. The salt must
# be an env: or file: secret, never a literal. The response header is always
# x-llmux-end-user and carries only the hash.
# end_user_header = "x-llmux-end-user"
# end_user_salt = "env:LLMUX_END_USER_SALT"
# end_user_from_body = true
# remote_images = "allow" # or "reject"
# max_image_bytes = 5000000

[routing]
max_attempts = 2
fallback_on = ["rate_limited", "quota_exhausted"]

[cooldown]
default_ms = 30000
max_ms = 3600000
# Cap for provider-reported quota resets (daily/monthly); must be >= max_ms.
# quota_max_ms = 2764800000 # 32 days

[[credentials]]
id = "groq-key"
kind = "api_key"
provider = "openai_compat"
key = "env:GROQ_API_KEY"

# Alternatively, configure OAuth refresh-token credentials (see README):
# [[credentials]]
# id = "oauth-account"
# kind = "oauth"
# provider = "openai_compat"
# token_url = "https://auth.example.com/oauth/token"
# client_id = "gateway-client"
# refresh_token = "file:/path/to/refresh-token" # rotations atomically rewrite this file (0600 on Unix)
# client_secret = "env:UPSTREAM_CLIENT_SECRET" # optional
# scopes = ["inference"] # optional
# resource = "https://api.openai.com/v1" # optional HTTPS URL; omit scopes for Sign in with ChatGPT
# refresh_skew_ms = 60000
# request_timeout_ms = 30000

[[credentials]]
id = "together-key"
kind = "api_key"
provider = "openai_compat"
key = "env:TOGETHER_API_KEY"

[[credentials]]
id = "anthropic-key"
kind = "api_key"
provider = "anthropic"
key = "env:ANTHROPIC_API_KEY"

[[models]]
name = "llama-3.3-70b"
aliases = ["llama-70b"]
capabilities = { stream = true, max_context = 131072 }

[[models.deployments]]
id = "groq-llama70b"
credential = "groq-key"
base_url = "https://api.groq.com/openai/v1"
upstream_model = "llama-3.3-70b-versatile"
priority = 0
timeout_ms = 30000

[[models.deployments]]
id = "together-llama70b"
credential = "together-key"
base_url = "https://api.together.xyz/v1"
upstream_model = "meta-llama/Llama-3.3-70B-Instruct-Turbo"
priority = 10
timeout_ms = 30000

[[models]]
name = "claude-sonnet"
capabilities = { stream = true }

[[models.deployments]]
id = "anthropic-sonnet"
credential = "anthropic-key"
base_url = "https://api.anthropic.com/v1"
upstream_model = "claude-sonnet-4-5"
timeout_ms = 60000

# Devin SWE-2 through the `devin acp` CLI bridge. `devin_acp` takes no
# credential: the gateway spawns `devin` (LLMUX_DEVIN_BIN, default `devin` on
# PATH) with HOME pointed at LLMUX_DEVIN_HOME (default $HOME/.devin-sandbox),
# which must hold the CLI's own credentials.toml. swe-2-high is free.
[[models]]
name = "swe-2"
capabilities = { stream = true, max_context = 262144 }

[[models.deployments]]
id = "devin-swe2-high"
auth = "none"
provider = "devin_acp"
upstream_model = "swe-2-high"
priority = 0
timeout_ms = 120000

# Paid sibling (about $1 / 1M input); enable only when paid Devin usage is wanted.
# [[models.deployments]]
# id = "devin-swe2-lightning"
# auth = "none"
# provider = "devin_acp"
# upstream_model = "swe-2-high-lightning"
# priority = 10
# timeout_ms = 120000

# Any agent CLI that speaks ACP JSON-RPC on stdio (for example `auggie --acp`)
# can serve a model through the `acp_agent` provider. The credential declares
# the managed child: an absolute command path, its args, an env allowlist, and
# a sandbox home the child's HOME/XDG dirs point at (put the CLI's own config
# and sign-ins there). A fresh child runs per request; session_mode =
# "persistent" keeps one initialized child per credential and multiplexes
# turns. env values accept env:/file: references like deployment headers.
# [[credentials]]
# id = "auggie"
# kind = "acp_agent"
# provider = "acp_agent"
# command = "/usr/local/bin/auggie"
# args = ["--acp"]
# env = { AUGMENT_API_TOKEN = "env:AUGMENT_API_TOKEN" }
# home = "/var/lib/llmux/auggie-home"
# turn_timeout_ms = 120000
# session_mode = "per_request"
#
# [[models]]
# name = "auggie"
# capabilities = { stream = true }
#
# [[models.deployments]]
# id = "auggie-local"
# credential = "auggie"
# upstream_model = "default"
# timeout_ms = 120000
