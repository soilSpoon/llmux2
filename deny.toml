# `cargo deny check advisories` runs in CI (.github/workflows/advisories.yml).
# Every ignore needs an id, a reason, and the change that lets it be removed.

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no safe upgrade; llmux-login uses it only for token expiry timestamps. Remove once llmux-login moves to jiff or time." },
]
